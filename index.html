  <title>トイレ我慢ゲーム</title>
  <style>
    :root { color-scheme: dark; background: #071016; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071016; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; }
    #unity-shell {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #071016;
    }
    #unity-container {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
      background: #17252c;
    }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1F1F20; }
    #unity-loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      gap: 18px;
      text-align: center;
      color: #f2f5f6;
      background: #17252c;
      z-index: 5;
    }
    #unity-loading strong { font-size: 22px; letter-spacing: 0; }
    #progress-track { width: min(54vw, 320px); height: 5px; overflow: hidden; background: #52636b; }
    #progress-fill { width: 0; height: 100%; background: #f6b92b; transition: width 120ms linear; }
    #unity-warning {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      width: min(92%, 720px);
      transform: translateX(-50%);
      z-index: 10;
    }
    #unity-warning > div { margin-bottom: 6px; padding: 10px 14px; color: #111; background: #f6b92b; }
    #fullscreen-button {
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      z-index: 4;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 4px;
      color: #fff;
      background: rgba(7,16,22,.58);
      font: 22px/1 sans-serif;
      cursor: pointer;
    }
    #orientation-warning {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      place-content: center;
      padding: 28px;
      text-align: center;
      color: #f5f7f8;
      background: #071016;
    }
    #orientation-warning strong { display: block; margin-bottom: 8px; font-size: 22px; }
    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      #orientation-warning { display: grid; }
    }
  </style>
</head>
<body>
  <main id="unity-shell">
    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <div id="unity-loading">
        <strong>トイレ我慢ゲーム</strong>
        <div id="progress-track"><div id="progress-fill"></div></div>
      </div>
      <div id="unity-warning"></div>
      <button id="fullscreen-button" type="button" title="全画面" aria-label="全画面">&#x26F6;</button>
    </div>
  </main>
  <aside id="orientation-warning">
    <strong>端末を横向きにしてね</strong>
    駅構内を見渡しながら遊ぶゲームです。
  </aside>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#unity-loading");
    var progressFill = document.querySelector("#progress-fill");

    function unityShowBanner(message, type) {
      var warning = document.querySelector("#unity-warning");
      var item = document.createElement("div");
      item.textContent = message;
      if (type === "error") item.style.background = "#ef5555";
      warning.appendChild(item);
      if (type !== "error") setTimeout(function () { item.remove(); }, 5000);
    }

    var buildUrl = "Build";
    var requestedBuildVersion = new URLSearchParams(window.location.search).get("v");
    var buildVersionSuffix = "?v=" + encodeURIComponent(requestedBuildVersion || document.lastModified);
    var loaderUrl = buildUrl + "/webgl-release.loader.js" + buildVersionSuffix;
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/webgl-release.data.unityweb" + buildVersionSuffix,
      frameworkUrl: buildUrl + "/webgl-release.framework.js.unityweb" + buildVersionSuffix,
      codeUrl: buildUrl + "/webgl-release.wasm.unityweb" + buildVersionSuffix,
      streamingAssetsUrl: "StreamingAssets",
      autoSyncPersistentDataPath: true,
      companyName: "nekoojisan",
      productName: "トイレ我慢ゲーム",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) config.devicePixelRatio = 1;
    canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressFill.style.width = Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        loading.style.display = "none";
        document.querySelector("#fullscreen-button").onclick = function () {
          unityInstance.SetFullscreen(1);
        };
      }).catch(function (error) {
        loading.innerHTML = "<strong>読み込みに失敗しました</strong><span>ページを再読み込みしてください。</span>";
        unityShowBanner(String(error), "error");
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
