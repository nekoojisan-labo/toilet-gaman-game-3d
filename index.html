<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05090d">
    <title>トイレ我慢ゲーム 3D 駅構内ラン</title>
    <link rel="stylesheet" href="./style.css?v=20260710-full3d-r1">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./game-3d.js?v=20260710-maze-r2"></script>
  </head>
  <body data-mode="title">
    <main class="game-shell" aria-label="トイレ我慢ゲーム">
      <section class="game-viewport" aria-label="ゲーム画面">
        <canvas id="gameCanvas" width="1280" height="720"></canvas>
        <div class="scene-shade" aria-hidden="true"></div>

        <div class="impact-layer" id="impactLayer" aria-hidden="true">
          <b id="impactTitle">IMPACT</b>
          <span id="impactDetail">我慢 -0</span>
        </div>

        <header class="hud" aria-label="ゲーム状況">
          <div class="mission-panel">
            <div class="mission-meta">
              <span id="stageNo">STAGE 1</span>
              <span id="boardStatus">HOME ROUTE</span>
            </div>
            <strong id="stageName">深夜ホーム</strong>
          </div>

          <div class="timer" id="timerBox" aria-live="polite">
            <span>LIMIT</span>
            <strong id="timeValue">40.0</strong>
          </div>

          <div class="condition-panel">
            <div class="condition-meter">
              <div class="condition-label">
                <span>PRESSURE</span>
                <strong id="dignityValue">100%</strong>
              </div>
              <div class="meter"><i id="dignityFill"></i></div>
            </div>
            <img class="face" id="facePortrait" src="./assets/sprites/face-normal.png" alt="主人公の表情">
            <button class="icon-button" id="pauseButton" type="button" aria-label="一時停止">Ⅱ</button>
          </div>
        </header>

        <div class="route-hud" aria-label="トイレまでの進行状況">
          <span>現在地</span>
          <div class="route-track"><i id="distanceFill"></i></div>
          <strong id="distanceValue">トイレまで 100%</strong>
        </div>

        <div class="screen-layer active" id="screenLayer" data-screen="title" aria-hidden="false">
          <div class="title-panel">
            <div class="screen-main">
              <p class="kicker">DIGNITY ESCAPE MISSION</p>
              <h1>TOILET<span>我慢ゲーム</span></h1>
              <p class="screen-copy" id="screenCopy">人波を読み、限界までに扉へ辿り着け。ホームからトイレ前まで、5つの駅区画を走り抜ける尊厳防衛タイムアタック。</p>
              <div class="screen-actions" id="screenActions">
                <button class="primary" type="button" data-action="start">STAGE 01 を開始</button>
              </div>
            </div>

            <div class="result-scene" id="resultScene" hidden></div>

            <section class="stage-select" id="stageSelect" aria-label="ステージ選択">
              <div class="stage-select-heading">
                <span>STATION RUN</span>
                <strong>5 STAGES</strong>
              </div>
              <ol id="stageList"></ol>
            </section>
          </div>
        </div>

        <div class="pause-layer" id="pauseLayer" hidden aria-hidden="true">
          <div class="pause-panel">
            <p>RUN SUSPENDED</p>
            <h2>PAUSE<span>一時停止</span></h2>
            <div class="pause-actions">
              <button class="primary" type="button" data-pause-action="resume">RESUME</button>
              <button type="button" data-pause-action="retry">RETRY</button>
              <button type="button" data-pause-action="title">STAGE SELECT</button>
            </div>
          </div>
        </div>

        <nav class="touch-controls" aria-label="移動操作">
          <div class="mobile-stick" id="mobileStick" aria-label="移動スティック">
            <i id="stickKnob"></i>
          </div>
          <button id="dodgeButton" class="dodge" type="button" aria-label="回避" title="回避">回避</button>
        </nav>
      </section>
    </main>
  </body>
</html>
